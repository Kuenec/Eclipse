[package]
name = "eclipse-config"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Eclipse's settings schema, config.json loading, atomic file replacement and shell quoting"

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[lints]
workspace = true
