[package]
name = "eclipse-webview"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false
description = "WebKitGTK helper that shows each Android WebView the Roblox client opens as its own window"

[dependencies]
gdk4-wayland = "0.11"
gdk4-x11 = { version = "0.11", features = ["xlib"] }
gtk4 = { version = "0.11", features = ["v4_10"] }
webkit6 = { version = "0.6", features = ["v2_42"] }

[[bin]]
name = "eclipse-webview"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
