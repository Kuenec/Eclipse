
[package]
name = "eclipse"
version = "0.1.5"
edition = "2021"

rust-version = "1.95"
description = "Open-source Rust runtime for running the Android x86-64 Roblox client on Linux"
license = "MIT"
publish = false

[workspace]
members = ["crates/eclipse-config"]
default-members = [".", "crates/eclipse-config"]
exclude = ["crates/libm-shim"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]

eclipse-config = { path = "crates/eclipse-config" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.11"
ring = "0.17"
aes = "0.9"

crc32fast = "1"

libloading = "0.8"
jni-sys = "0.4"
jni = "0.22"

winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-crossfont"] }
smithay-clipboard = "=0.7.2"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
x11-clipboard = "0.9.3"

rustix = { version = "1", default-features = false, features = ["mm", "param"] }

libc = "0.2"

ash = { version = "0.38", default-features = false, features = ["loaded", "std", "debug"] }
ash-window = "0.13"
raw-window-handle = "0.6"

khronos-egl = { version = "6", features = ["dynamic"] }

freetype-rs = "0.36"
yeslogic-fontconfig-sys = "5"
harfrust = "0.13"
read-fonts = "0.43"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-properties = "0.1"

cpal = "0.18"

tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

libsqlite3-sys = { version = "0.38.1", features = ["bundled"] }

ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[dev-dependencies]

rustix = { version = "1", default-features = false, features = ["fs", "time"] }

[build-dependencies]

cc = "1"

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

panic = "abort"
strip = true
