# Eclipse — crate manifest.
#
# Deps are added per subsystem, only when that subsystem is actually built — we don't pull
# unverified crate versions or system libs (vulkan/pulse/gtk dev headers, the vendored ART)
# ahead of need. M1 has wired diagnostics + config + apk + the runtime ART-boot FFI; the
# remaining subsystems (audio, input, services, bionic) are still stubs (graphics has the winit
# host window + an ash/Vulkan surface+swapchain+clear-present loop; the View-tree draw / engine
# WSI forwarding are next).
#
# The full, annotated dependency PLAN (what each subsystem will use, and why) lives in
# docs/dependency-plan.md. Add deps to this file only when wiring up the subsystem, after
# verifying the version with `cargo add` (priorities: stability > pure-Rust > no bloat).
#
# Single crate for now (simplicity-first). Split into a workspace once subsystems grow.

[package]
name = "eclipse"
version = "0.0.0"
edition = "2021"
# 2026-06-04: pinned to the dev/CI toolchain (conservative). The code itself needs far less
# (let-else = 1.65); the true MSRV floor is a dependency's (winit/jni-sys/zip) — lower this
# once verified against older toolchains (none installed here). Pinned, not minimal (§2.11).
rust-version = "1.95"
description = "Open-source, Rust, distro-agnostic runtime for running the Android Roblox build on Linux"
license = "TBD"            # deferred per project decision
publish = false

[dependencies]
# --- Launcher foundation: diagnostics + config (M1) -----------------------------
tracing = "0.1"                                                     # structured diagnostics facade
tracing-subscriber = { version = "0.3", features = ["env-filter"] } # RUST_LOG-driven subscriber
serde = { version = "1", features = ["derive"] }                    # config.json (mirror Sober schema)
serde_json = "1"                                                    # config.json (de)serialization
directories = "6"                                                   # portable XDG dirs (no hardcoded paths)
# --- APK parse / verify (M1) ----------------------------------------------------
# Local-only: open the APK zip, read binary AndroidManifest.xml, verify SHA-256.
# Network fetch (ureq/rustls) stays deferred — see docs/dependency-plan.md.
# APK container. `deflate` decompresses the Deflate-compressed AndroidManifest.xml (libroblox.so
# is Stored). 2026-06-04: `deflate` is the ONLY pure-Rust deflate option in zip 2.4.2 — it pulls
# flate2/rust_backend (miniz_oxide) and, unavoidably, the zopfli compressor we never use; the
# zopfli-free alternatives (`deflate-zlib`/`-zlib-ng`) link a C zlib, violating pure-Rust/
# portability (§2.1/§9), and `deflate-flate2` alone has no backend (won't compile). So zopfli's
# ~2 crates are accepted as the cost of a pure-Rust decoder; revisit if zip exposes a leaner path.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"                                     # streaming artifact-integrity hash (lowercase hex via std::fmt, no `hex` crate)
# --- Runtime: boot the vendored ART VM (M1) -------------------------------------
libloading = "0.9"                                # dlopen the vendored /usr/lib/art/libart.so (no link-time ART dep)
jni-sys = "0.4"                                   # raw JNI invocation types used by boot()'s JNI_CreateJavaVM
jni = "0.22"                                      # safe JNI wrapper for the onCreate framework driver (wraps the held *mut JavaVM)
# --- Graphics/window: the host game window (M2) ----------------------------------
winit = "0.30"                                    # Wayland/X11 window + event loop (NO GTK — keeps low_4gb clear for ART; ash/khronos-egl for forwarding come later)
# 2026-06-05: mmap/mprotect/munmap for the bionic-loader's PT_LOAD segment mapper (src/loader/map.rs).
# `mm` feature ONLY. rustix is ALREADY in the tree (winit→x11rb/wayland/polling pull rustix 1.x), so this
# adds ZERO new transitive crates (verified `cargo tree`); more pure-Rust than `libc` (linux_raw backend
# issues syscalls directly, no C-library link) — aligns with §2.1 pure-Rust + §9 portability + §2.5 no-bloat.
rustix = { version = "1", default-features = false, features = ["mm", "param"] }
# 2026-06-05: Vulkan surface+swapchain+present foundation on the winit window. `loaded` makes ash
# dlopen the host libvulkan.so at runtime (Entry::load) — detect-don't-assume, no link-time Vulkan
# dep (§9 portability). `std` gives std::error::Error on vk::Result; `debug` gives the Debug impls.
ash = { version = "0.38", default-features = false, features = ["loaded", "std", "debug"] }
ash-window = "0.13"                               # ash ↔ raw-window-handle interop: required surface extensions + VkSurfaceKHR from the window
raw-window-handle = "0.6"                         # the window/display handle abstraction (deduped with winit 0.30's own dep)
# 2026-06-05: pure-Rust glyph rasterizer for the View-tree TEXT pass — rasterizes each TextView's
# text into an R8 glyph atlas the text pipeline samples. Pure Rust (ttf-parser/owned_ttf_parser),
# no C/system font lib (§2.1); the system font FILE is found portably at runtime via fontconfig
# `fc-match` / known font dirs (detect-don't-assume §9), never linking fontconfig.
ab_glyph = "0.2"
# 2026-06-05: pure-Rust software 2D rasterizer (a Skia subset, no C/Skia link) for the vector-drawable
# pass — fills each android.graphics.Path's REAL recorded geometry (path_registry) into an RGBA Pixmap
# the renderer uploads as a GPU texture (mirroring the glyph atlas). `std` + `simd` (default) kept;
# `png-format` dropped (no PNG encode/decode — Eclipse uploads raw RGBA straight to the GPU; no bloat
# §2.5). Pure Rust (tiny-skia-path/png/fdeflate), no GTK/Cairo/Skia-C (§2.1).
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# 2026-06-04: dropped `axmldecoder 0.3` (it panicked on hostile AXML — see src/apk/axml.rs).
# The binary AndroidManifest.xml reader is now Eclipse's own pure-Rust, total module (§2.1/2.5/2.8).
# Remaining subsystem deps are still planned-only — see docs/dependency-plan.md.

# Enforce the project requirements (see AGENTS.md). CI/local gate before any commit:
#   cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings && cargo test
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"   # unsafe must be explicit even inside unsafe fns
unreachable_pub = "warn"          # keep the public surface tight (no bloat)
unused = { level = "warn", priority = -1 }   # group: lower priority so specific lints win

[lints.clippy]
all = { level = "warn", priority = -1 }   # promoted to errors in CI via -D warnings

# "Optimized as much as possible" — max runtime speed, smallest binary (no bloat).
[profile.release]
opt-level = 3
lto = true              # fat LTO: best runtime perf (trades build time — fine, we have few deps)
codegen-units = 1       # better optimization at the cost of parallel codegen
# 2026-06-04: panic = "abort" per AGENTS.md §2.4 (smallest binary, best codegen, and a strict
# no-unwind posture for the future FFI/JNI boundaries — a panic must never unwind across them).
# This is safe because the only untrusted-input parser, the binary AndroidManifest.xml reader
# (src/apk/axml.rs), is now *total*: it returns a typed ApkError::Axml(AxmlError) for every
# malformed/hostile manifest and never panics (§2.8). The previous catch_unwind-based guard
# (which required unwind) is gone with the panic-prone axmldecoder dependency it protected.
panic = "abort"
strip = true            # strip symbols from the shipped binary
