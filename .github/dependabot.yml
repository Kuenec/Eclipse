version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /crates/libm-shim
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    groups:
      libm-shim-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /crates/eclipse-webview
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    groups:
      webview-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Paris
    groups:
      github-actions:
        patterns: ["*"]
