name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux-payload:
    name: Linux x86-64 payload
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCH: x86_64
    steps: &payload-steps
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            pkg-config \
            zstd

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d

      - name: Restore Cargo caches
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: release-payload
          workspaces: |
            . -> target
            crates/eclipse-webview -> target

      - name: Build Eclipse and the WebView helper
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path crates/eclipse-webview/Cargo.toml
          mkdir -p "dist/eclipse-linux-$ARCH"
          cp target/release/eclipse crates/eclipse-webview/target/release/eclipse-webview "dist/eclipse-linux-$ARCH/"

      - name: Create compressed release archive
        run: |
          mkdir -p release
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            archive_name="eclipse-${GITHUB_REF_NAME}-linux-$ARCH.tar.zst"
          else
            archive_name="eclipse-${GITHUB_SHA:0:7}-linux-$ARCH.tar.zst"
          fi
          tar --zstd -cf "release/$archive_name" -C dist "eclipse-linux-$ARCH"
          sha256sum "release/$archive_name" > release/SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: eclipse-complete-linux-${{ env.ARCH }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  linux-payload-aarch64:
    name: Linux ARM64 payload
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      ARCH: aarch64
    steps: *payload-steps

  publish:
    name: Attach the payload to the GitHub release
    needs: linux-payload
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Write the release notes from the metainfo
        run: |
          python3 packaging/flatpak/release-notes.py "${GITHUB_REF_NAME#v}" \
            > "$RUNNER_TEMP/notes.md"

      - name: Download the payload
        uses: actions/download-artifact@v8
        with:
          name: eclipse-complete-linux-x86_64
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RUNNER_TEMP/notes.md" --title "Eclipse $GITHUB_REF_NAME" --verify-tag \
            || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
