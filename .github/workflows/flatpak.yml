name: Flatpak

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!tests/**"
      - "!.github/**"
      - .github/workflows/flatpak.yml
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!tests/**"
      - "!.github/**"
      - .github/workflows/flatpak.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.ref_type == 'tag' && 'flatpak-publish' || format('flatpak-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  FLATPAK_ID: io.github.kuenec.Eclipse
  FLATPAK_BRANCH: stable
  FLATPAK_BUNDLE: eclipse-x86_64.flatpak
  FLATHUB_REPO: https://dl.flathub.org/repo/flathub.flatpakrepo

jobs:
  cargo-sources:
    name: Check the vendored Cargo sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test the vendored source check
        run: python3 packaging/flatpak/check-cargo-sources-test.py

      - name: Check that cargo-sources.json vendors every crate in the Cargo.lock files
        run: python3 packaging/flatpak/check-cargo-sources.py

  listing:
    name: Lint the desktop files, manifest and metainfo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate the desktop files
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils
          desktop-file-validate packaging/flatpak/*.desktop

      - name: Lint the manifest with Flathub's linter
        uses: docker://ghcr.io/flathub/flatpak-builder-lint@sha256:8ed347aa44505db9f786a797ab78239bdd7c92027bd7a6817af51add26a20b83
        with:
          args: --exceptions --user-exceptions packaging/flatpak/lint-exceptions.json --gha-format manifest packaging/flatpak/io.github.kuenec.Eclipse.yml

      - name: Lint the metainfo with Flathub's linter
        uses: docker://ghcr.io/flathub/flatpak-builder-lint@sha256:8ed347aa44505db9f786a797ab78239bdd7c92027bd7a6817af51add26a20b83
        with:
          args: appstream packaging/flatpak/io.github.kuenec.Eclipse.metainfo.xml

  build:
    name: Build Flatpak
    needs: cargo-sources
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      pages: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    env:
      PUBLISH: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check the release notes of the tagged version before anything is published
        if: github.ref_type == 'tag'
        run: python3 packaging/flatpak/release-notes.py "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Test the installed-size gate
        run: packaging/flatpak/check-installed-size-test.sh

      - name: Resolve the GitHub Pages URL (Settings, Pages, Source must be GitHub Actions)
        id: pages
        if: env.PUBLISH == 'true'
        uses: actions/configure-pages@v6

      - name: Build the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          manifest-path: packaging/flatpak/io.github.kuenec.Eclipse.yml
          branch: ${{ env.FLATPAK_BRANCH }}
          build-bundle: false
          build-dir: flatpak_app
          repo-dir: build-repo
          cache-key: flatpak-builder-x86_64-${{ hashFiles('packaging/flatpak/io.github.kuenec.Eclipse.yml', 'packaging/flatpak/patches/**', 'tools/framework-overlay/**') }}

      - name: Check the installed size against the budget
        run: packaging/flatpak/check-installed-size.sh build-repo "app/$FLATPAK_ID/x86_64/$FLATPAK_BRANCH"

      - name: Pack the build directory without its debug symbols
        run: tar -C flatpak_app --exclude=./files/lib/debug -cf flatpak-builddir.tar .

      - name: Upload the build directory for the build lint
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-builddir
          path: flatpak-builddir.tar
          if-no-files-found: error
          retention-days: 1

      - name: Import the repository signing key from the FLATPAK_GPG_PRIVATE_KEY secret
        id: gpg
        if: env.PUBLISH == 'true'
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            echo "::error::Store an ASCII-armored GPG private key without a passphrase as the repository secret FLATPAK_GPG_PRIVATE_KEY"
            exit 1
          fi
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ -z "$fingerprint" ]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY does not contain a secret key"
            exit 1
          fi
          gpg --batch --export "$fingerprint" > "$RUNNER_TEMP/flatpak-signing-key.gpg"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore the published OSTree repository
        if: env.PUBLISH == 'true'
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          ostree --repo=repo init --mode=archive-z2
          status="$(curl --silent --location --output /dev/null --write-out '%{http_code}' "$PAGES_URL/repo/config")"
          case "$status" in
            200)
              ostree --repo=repo remote add --gpg-import="$RUNNER_TEMP/flatpak-signing-key.gpg" published "$PAGES_URL/repo"
              ostree --repo=repo pull --mirror --depth=0 published "app/$FLATPAK_ID/x86_64/$FLATPAK_BRANCH"
              ostree --repo=repo remote delete published
              ;;
            404)
              echo "No OSTree repository is published at $PAGES_URL/repo yet; starting a new one"
              ;;
            *)
              echo "::error::GitHub Pages answered HTTP $status for $PAGES_URL/repo/config"
              exit 1
              ;;
          esac

      - name: Sign the application build into the repository without its debug symbols
        if: env.PUBLISH == 'true'
        env:
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          flatpak build-commit-from --src-repo=build-repo --gpg-sign="$GPG_FINGERPRINT" \
            --no-update-summary repo "app/$FLATPAK_ID/x86_64/$FLATPAK_BRANCH"

      - name: Prune the repository and create the bundle and repository descriptions
        if: env.PUBLISH == 'true'
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          flatpak build-update-repo --prune --prune-depth=1 --gpg-sign="$GPG_FINGERPRINT" \
            --title=Eclipse --default-branch="$FLATPAK_BRANCH" \
            --homepage="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" repo
          flatpak build-bundle --arch=x86_64 --repo-url="$PAGES_URL/repo/" \
            --runtime-repo="$FLATHUB_REPO" --gpg-keys="$RUNNER_TEMP/flatpak-signing-key.gpg" \
            repo "$FLATPAK_BUNDLE" "$FLATPAK_ID" "$FLATPAK_BRANCH"
          gpg_key="$(base64 --wrap=0 "$RUNNER_TEMP/flatpak-signing-key.gpg")"
          mkdir site
          mv repo site/repo
          cp "packaging/flatpak/$FLATPAK_ID.svg" "site/$FLATPAK_ID.svg"
          cat > "site/$FLATPAK_ID.flatpakrepo" <<EOF
          [Flatpak Repo]
          Title=Eclipse
          Url=$PAGES_URL/repo/
          Homepage=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          Comment=Run the Android Roblox client on Linux
          Icon=$PAGES_URL/$FLATPAK_ID.svg
          GPGKey=$gpg_key
          EOF
          cat > "site/$FLATPAK_ID.flatpakref" <<EOF
          [Flatpak Ref]
          Name=$FLATPAK_ID
          Branch=$FLATPAK_BRANCH
          Title=Eclipse
          Url=$PAGES_URL/repo/
          SuggestRemoteName=eclipse
          RuntimeRepo=$FLATHUB_REPO
          IsRuntime=false
          GPGKey=$gpg_key
          EOF

      - name: Upload the Flatpak bundle
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FLATPAK_BUNDLE }}
          path: ${{ env.FLATPAK_BUNDLE }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload the OSTree repository for GitHub Pages
        if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  lint-build:
    name: Lint the Flatpak build directory
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the build directory
        uses: actions/download-artifact@v8
        with:
          name: flatpak-builddir

      - name: Unpack the build directory
        run: |
          mkdir flatpak_app
          tar -C flatpak_app -xf flatpak-builddir.tar

      - name: Lint the build directory with Flathub's linter
        uses: docker://ghcr.io/flathub/flatpak-builder-lint@sha256:8ed347aa44505db9f786a797ab78239bdd7c92027bd7a6817af51add26a20b83
        with:
          args: --exceptions --user-exceptions packaging/flatpak/lint-exceptions.json --gha-format builddir flatpak_app

  pages:
    name: Publish the OSTree repository
    needs: [build, lint-build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Attach the bundle to the GitHub release
    needs: [build, lint-build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Write the release notes from the metainfo
        run: |
          python3 packaging/flatpak/release-notes.py "${GITHUB_REF_NAME#v}" \
            > "$RUNNER_TEMP/notes.md"

      - name: Download the Flatpak bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.FLATPAK_BUNDLE }}

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RUNNER_TEMP/notes.md" --title "Eclipse $GITHUB_REF_NAME" --verify-tag \
            || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "$FLATPAK_BUNDLE" --repo "$GITHUB_REPOSITORY" --clobber
