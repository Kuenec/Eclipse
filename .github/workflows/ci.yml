name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libdbus-1-dev libfontconfig1-dev libfreetype6-dev pkg-config shellcheck

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          components: clippy, rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: quality

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check detached crate formatting
        run: |
          cargo fmt --manifest-path crates/libm-shim/Cargo.toml -- --check
          cargo fmt --manifest-path crates/eclipse-webview/Cargo.toml -- --check
          cargo fmt --manifest-path crates/eclipse-settings/Cargo.toml -- --check

      - name: Lint Eclipse
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Lint libm shim
        run: cargo clippy --manifest-path crates/libm-shim/Cargo.toml --all-targets --locked -- -D warnings

      - name: Lint shell scripts
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

      - name: Check the release notes of the current version
        run: |
          python3 packaging/flatpak/release-notes-test.py
          python3 packaging/flatpak/release-notes.py > /dev/null

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    name: Tests / stable
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libdbus-1-dev libfontconfig1-dev libfreetype6-dev pkg-config dbus-daemon

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: tests-stable

      - name: Run every Eclipse target and test
        run: cargo test --all-targets --locked

      - name: Test detached libm shim crate
        run: cargo test --manifest-path crates/libm-shim/Cargo.toml --all-targets --locked

      - name: Test the performance harness
        run: python3 -m unittest discover --start-directory tools/perf --pattern 'test_*.py'

  msrv:
    name: MSRV / Rust 1.95
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libdbus-1-dev libfontconfig1-dev libfreetype6-dev pkg-config

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: msrv-1.95

      - name: Check every target against the MSRV
        run: cargo check --all-targets --locked

  webview:
    name: GTK apps / GNOME 51 SDK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare the GNOME 51 SDK with Rust
        run: |
          flatpak install --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//26.08
          flatpak build-init "$RUNNER_TEMP/sdk" io.github.kuenec.Eclipse org.gnome.Sdk org.gnome.Platform 51

      - name: Lint and test the WebView helper and the settings app in the SDK
        run: |
          mkdir -p "$RUNNER_TEMP/cargo" "$GITHUB_WORKSPACE/crates/eclipse-webview/target" \
            "$GITHUB_WORKSPACE/crates/eclipse-settings/target"
          chmod -R a+rwX "$RUNNER_TEMP/cargo" "$GITHUB_WORKSPACE"
          in_sdk() {
            crate="$1"
            shift
            flatpak build --share=network --filesystem="$GITHUB_WORKSPACE" --filesystem="$RUNNER_TEMP" \
              --build-dir="$GITHUB_WORKSPACE/crates/$crate" \
              --env=PATH=/usr/lib/sdk/rust-stable/bin:/usr/bin --env=CARGO_HOME="$RUNNER_TEMP/cargo" \
              "$RUNNER_TEMP/sdk" "$@"
          }
          for crate in eclipse-webview eclipse-settings; do
            in_sdk "$crate" cargo clippy --all-targets --locked -- -D warnings
            in_sdk "$crate" cargo test --all-targets --locked
          done

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libdbus-1-dev libfontconfig1-dev libfreetype6-dev pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: release

      - name: Build optimized binary
        run: cargo build --release --locked

      - name: Smoke-test the CLI
        run: |
          target/release/eclipse --version
          target/release/eclipse help

      - name: Package standalone binary
        run: |
          mkdir -p artifacts
          tar -C target/release -czf artifacts/eclipse-linux-x86_64.tar.gz eclipse
          sha256sum artifacts/eclipse-linux-x86_64.tar.gz > artifacts/SHA256SUMS

      - name: Upload release-build artifact
        uses: actions/upload-artifact@v7
        with:
          name: eclipse-linux-x86_64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  ci-success:
    name: CI success
    if: always()
    needs: [quality, test, msrv, webview, release-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          WEBVIEW_RESULT: ${{ needs.webview.result }}
          BUILD_RESULT: ${{ needs.release-build.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$MSRV_RESULT" = success
          test "$WEBVIEW_RESULT" = success
          test "$BUILD_RESULT" = success
