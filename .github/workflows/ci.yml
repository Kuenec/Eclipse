name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libfontconfig1-dev libfreetype6-dev pkg-config shellcheck

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          components: clippy, rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: quality

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check detached crate formatting
        run: |
          cargo fmt --manifest-path crates/libm-shim/Cargo.toml -- --check
          cargo fmt --manifest-path crates/eclipse-webview/Cargo.toml -- --check

      - name: Lint Eclipse
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Lint libm shim
        run: cargo clippy --manifest-path crates/libm-shim/Cargo.toml --all-targets --locked -- -D warnings

      - name: Lint shell scripts
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    name: Tests / stable
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libfontconfig1-dev libfreetype6-dev pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: tests-stable

      - name: Run every Eclipse target and test
        run: cargo test --all-targets --locked

      - name: Test detached libm shim crate
        run: cargo test --manifest-path crates/libm-shim/Cargo.toml --all-targets --locked

  msrv:
    name: MSRV / Rust 1.95
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libfontconfig1-dev libfreetype6-dev pkg-config

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@eb0a44f258ec94ab9ee0f14f998f4cf332c25d3a

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: msrv-1.95

      - name: Check every target against the MSRV
        run: cargo check --all-targets --locked

  webview:
    name: WebView helper
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/eclipse-webview
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install CEF runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libgbm1 libgtk-3-dev libnss3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          components: clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: webview
          workspaces: crates/eclipse-webview -> target

      - name: Require Cargo.lock to use the pinned CEF archive
        id: cef
        run: |
          pin() { sed -n "s/^$1=\"\(.*\)\"$/\1/p" ../../tools/webview-dist/package-webview.sh; }
          archive="$(pin PIN_ARCHIVE)"
          version="${archive#cef_binary_}"
          version="${version%%+*}"
          locked="$(sed -n '/^name = "cef-dll-sys"$/{n;s/^version = ".*+\(.*\)"$/\1/p}' Cargo.lock)"
          if [ "$locked" != "$version" ]; then
            echo "::error::cef-dll-sys in Cargo.lock builds against CEF $locked, not the pinned $version; move the pins in tools/webview-dist/package-webview.sh with the cef crate"
            exit 1
          fi
          {
            echo "archive=$archive"
            echo "sha1=$(pin PIN_SHA1)"
            echo "dir=$RUNNER_TEMP/cef/$version/cef_linux_x86_64"
          } >> "$GITHUB_OUTPUT"
          echo "CEF_PATH=$RUNNER_TEMP/cef" >> "$GITHUB_ENV"

      - name: Restore the CEF distribution
        id: cef-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.cef.outputs.dir }}
          key: cef-${{ steps.cef.outputs.archive }}

      - name: Build the helper and its tests
        run: cargo build --all-targets --locked

      - name: Require the pinned CEF distribution
        env:
          CEF_DIR: ${{ steps.cef.outputs.dir }}
          PIN_ARCHIVE: ${{ steps.cef.outputs.archive }}
          PIN_SHA1: ${{ steps.cef.outputs.sha1 }}
        run: |
          fail() { echo "::error::$1; move the pins in tools/webview-dist/package-webview.sh with the cef crate"; exit 1; }
          field() { sed -n "s/.*\"$1\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" "$CEF_DIR/archive.json"; }
          [ -f "$CEF_DIR/archive.json" ] || fail "the helper did not build against $PIN_ARCHIVE"
          [ "$(field name)" = "$PIN_ARCHIVE" ] || fail "$CEF_DIR holds $(field name), not $PIN_ARCHIVE"
          [ "$(field sha1)" = "$PIN_SHA1" ] || fail "$CEF_DIR has sha1 $(field sha1), not $PIN_SHA1"

      - name: Save the CEF distribution
        if: steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.cef.outputs.dir }}
          key: cef-${{ steps.cef.outputs.archive }}

      - name: Lint the WebView helper
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test the WebView helper
        env:
          LD_LIBRARY_PATH: ${{ steps.cef.outputs.dir }}
        run: cargo test --all-targets --locked

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libfontconfig1-dev libfreetype6-dev pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: release

      - name: Build optimized binary
        run: cargo build --release --locked

      - name: Smoke-test the CLI
        run: |
          target/release/eclipse --version
          target/release/eclipse help

      - name: Package standalone binary
        run: |
          mkdir -p artifacts
          tar -C target/release -czf artifacts/eclipse-linux-x86_64.tar.gz eclipse
          sha256sum artifacts/eclipse-linux-x86_64.tar.gz > artifacts/SHA256SUMS

      - name: Upload release-build artifact
        uses: actions/upload-artifact@v7
        with:
          name: eclipse-linux-x86_64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  ci-success:
    name: CI success
    if: always()
    needs: [quality, test, msrv, webview, release-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          WEBVIEW_RESULT: ${{ needs.webview.result }}
          BUILD_RESULT: ${{ needs.release-build.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$MSRV_RESULT" = success
          test "$WEBVIEW_RESULT" = success
          test "$BUILD_RESULT" = success
